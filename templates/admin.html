<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/admin.css">
    <title>Admin SPOT</title>
</head>
<body>

    <div class="title-container">
        <h1 class="title">Panel de Administrador</h1>
    </div>

    <form action="{{ url_for('new_product') }}" method="POST">
        <button type="submit">Agregar Nuevo</button>
    </form>

    <div class="form-container">
        {% for product in products %}
        <div class="product-card">
            <p>{{ product.product_name }}</p>
            <a class="enlace" href="{{ url_for('edit_product', product_id=product.product_id) }}">Editar</a>
            <form class="button" action="{{ url_for('delete_product', product_id=product.product_id) }}" method="POST">
                <button type="submit">Eliminar</button>
            </form>
        </div>
        {% endfor %}
    </div>    
        <a href="/logout">Salir</a>

</body>
</html>
