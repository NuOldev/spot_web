<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin SPOT</title>
</head>
<body>

    <h1>Panel de Administrador</h1>

    <form action="{{ url_for('new_product') }}" method="POST">
        <button type="submit">Agregar Nuevo</button>
    </form>
        {% for product in products %}
        <div>
            <p>{{ product.product_name }}</p>
            <a href="{{ url_for('edit_product', product_id=product.product_id) }}">Editar</a>
            <form action="{{ url_for('delete_product', product_id=product.product_id) }}" method="POST">
                <button type="submit">Eliminar</button>
            </form>
        </div>
        {% endfor %}
        
        <a href="/logout">Salir</a>

</body>
</html>
