<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/admin.css">
    <title>Admin SPOT</title>
</head>
<body>

    <nav class="navbar">
        <h1 class="title">SPOT - Administración</h1>
    
        <div class="nav-actions">
            <form action="{{ url_for('new_product') }}" method="POST">
                <button class="new-product" type="submit">Agregar Nuevo</button>
            </form>
            <a href="/logout">Salir</a>
        </div>
    </nav>


    <main class="cards-container">
        {% for product in products %}
        <div class="product-card">
            <p>{{ product.product_name }}</p>
            <a href="{{ url_for('edit_product', product_id=product.product_id) }}">Editar</a>
            <form class="delete-button" action="{{ url_for('delete_product', product_id=product.product_id) }}" method="POST">
                <button type="button">Eliminar</button>
            </form>
        </div>
        {% endfor %}
    </main>    

</body>
</html>
